[package]
name = "sattime"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "orbital_time_server"
path = "src/main.rs"

[dependencies]
rustfft = "6.2.0"
num-complex = "0.4.6"
clap = { version = "4.5.11", features = ["derive"] }
crossbeam-channel = "0.5.13"
rayon = "1.10.0"
sgp4 = "2.4.0"
chrono = { version = "0.4.38", features = ["std"] }
ureq = "2.9.7"
soapysdr = "0.4.0"
ratatui = "0.26.1"
crossterm = "0.27.0"
libc = "0.2"
nalgebra = "0.35.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
